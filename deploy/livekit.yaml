# Keys come from LIVEKIT_KEYS in the environment ("key: secret").
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # true when the Pi is reachable from the internet (discovers the public IP via STUN)
  use_external_ip: false
logging:
  level: warn
